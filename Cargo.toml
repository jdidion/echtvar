[package]
name = "echtvar"
version = "0.2.3"
edition = "2021"

[features]
default = ["bed", "tab", "arrow"]
bed = ["dep:flate2"]
tab = ["dep:flate2"]
arrow = ["dep:arrow", "dep:parquet"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "echtvar_lib"
path = "src/lib/mod.rs"

[[bin]]
name = "echtvar"
path = "src/main.rs"


[dependencies]
rust-htslib = { version = "0.49", features = ["libdeflate", "static"] }
#bitpacking = "0.8.4"
stream-vbyte = "0.4.1"
clap = { version = "4", features = ["derive", "suggestions"] }
c2rust-bitfields = "0.3.0"
libc = "*"
# TODO: try deflate-miniz, deflate-zlib, deflate
zip = { version = "0.6.4", default-features = false, features = ["deflate"] }
byteorder = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

fasteval = { version = "0.2.4", features = ["unsafe-vars"] }

bincode = { version = "1.3.3" }
json5 = "0.4.1"

ieee754 = "0.2"
flate2 = { version = "1", optional = true }

# Experimental Arrow/Parquet on-disk format (alternative to the zip container).
arrow = { version = "59", optional = true, default-features = false }
parquet = { version = "59", optional = true, default-features = false, features = ["arrow", "zstd"] }

# Keep `target/` from ballooning: line tables still give file:line panics
# and backtraces, but skip step-through variable info. Typically 40-60%
# smaller `target/` for dev+test builds.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1

[lints.rust]
# Allow dependency macros to use this feature cfg without warnings.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"unsafe-vars\", \"bed\", \"tab\", \"arrow\"))"] }
